[project]
name = "decision-agent-lab"
version = "0.1.0"
description = "LLM generates / decision model decides / code acts: a measured harness for decision models (TypeSafe Jev, OpenAI Decisions, Upstage Solar Decide, local Ollama)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "openai>=3.26.0",
  "numpy>=2.0",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dalab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls real APIs; needs keys in .env"]
addopts = "-m 'not live'"
